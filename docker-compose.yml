name: ${COMPOSE_PROJECT_NAME:-turistplus-app1}

# App1 (organizator) u Docker-u. Jedna slika, više instanci: svaka instanca ima
# svoj env fajl (svoja baza) i svoj port na hostu.
#
#   docker compose -p helena --env-file instances/helena.env up -d --build
#   (env fajl sadrži EXTERNAL_NEON_DATABASE_URL, JWT_SECRET_KEY, ...; nije u git-u)
#
# Promenljive:
#   INSTANCE_ENV_FILE  putanja do env fajla instance (podrazumevano .env)
#   APP_PORT_HOST      port na hostu za UI (podrazumevano 3070)

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: ${INSTANCE_ENV_FILE:-.env}
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        BACKEND_HOST: backend
    depends_on:
      - backend
    ports:
      - "${APP_PORT_HOST:-3070}:80"
    restart: unless-stopped

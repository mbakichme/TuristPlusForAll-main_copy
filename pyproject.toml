[project]
name = "react-app"
version = "0.1.0"
description = "React App with FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "python-multipart==0.0.22",
    "watchfiles==1.1.1",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.50",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "reportlab>=5.0.1",
    "qrcode[pil]>=8.2",
    "openpyxl>=3.1.5",
    "google-genai>=2.24.0",
    "playwright>=1.63.0",
    "tzdata>=2026.4",
]

[tool.uv]
exclude-newer = "14 days"
# workshop-connect is published by us; exempt from the rolling window.
exclude-newer-package = { workshop-connect = "2027-01-01" }

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
    "zxing-cpp>=3.1.1",
]
